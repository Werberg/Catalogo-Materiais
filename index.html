<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Materiais</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; padding: 20px; max-width: 900px; margin: 0 auto; }
        .cabecalho { background: #0052cc; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .cabecalho h1 { font-size: 28px; display: flex; align-items: center; gap: 10px; }
        .cabecalho p { opacity: 0.9; margin-top: 5px; }
        .campo-busca { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
        .selecao { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 6px; margin-bottom: 20px; }
        .cartao { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .area-imagem { height: 300px; background: #e9ecef; display: flex; align-items: center; justify-content: center; color: #666; font-size: 16px; }
        .area-imagem img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .conteudo { padding: 20px; }
        .codigo { font-size: 22px; font-weight: bold; color: #0052cc; margin-bottom: 10px; }
        .descricao { font-size: 16px; color: #333; margin-bottom: 15px; line-height: 1.5; }
        .etiqueta { display: inline-block; background: #e6f0ff; color: #0052cc; padding: 6px 12px; border-radius: 20px; font-size: 14px; margin-bottom: 10px; }
        .unidade { font-size: 15px; color: #555; margin-top: 8px; }
        .aviso { color: #e67700; margin-top: 10px; font-style: italic; }
        .nenhum { text-align: center; padding: 40px; color: #666; font-size: 18px; }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>📦 Catálogo de Materiais</h1>
        <p>Consulta rápida de materiais e equipamentos</p>
    </div>

    <input type="text" id="busca" class="campo-busca" placeholder="Digite o código do material..." oninput="buscar()">
    <select id="filtroFamilia" class="selecao" onchange="buscar()">
        <option value="">Todas as Famílias</option>
    </select>

    <div id="resultado"></div>

<script>
let dados = [];
const extensoes = ['.jpg', '.jpeg', '.png', '.JPG', '.JPEG', '.PNG'];

async function carregarCSV() {
    try {
        const res = await fetch('dados.csv');
        const texto = await res.text();
        const linhas = texto.split('\n').filter(l => l.trim());
        const cab = linhas[0].split(';').map(c => c.trim());
        
        dados = linhas.slice(1).map(linha => {
            const val = linha.split(';').map(v => v.trim());
            return {
                codigo: val[0] || '',
                descricao: val[1] || '',
                unidade: val[2] || '',
                familia: val[3] || '',
                foto: val[4] || ''
            };
        }).filter(d => d.codigo);

        // Preencher filtro de famílias
        const familias = [...new Set(dados.map(d => d.familia).filter(f => f))].sort();
        const sel = document.getElementById('filtroFamilia');
        familias.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f;
            sel.appendChild(opt);
        });
    } catch (e) {
        console.error('Erro ao carregar dados:', e);
        document.getElementById('resultado').innerHTML = '<p class="nenhum">❌ Não foi possível carregar o dados.csv — verifique se o arquivo está na mesma pasta.</p>';
    }
}

async function testarImagem(codigo, nomeFoto) {
    // Se tem extensão fixa, testa ela
    if (nomeFoto.includes('.')) {
        const src = 'imagens/' + nomeFoto;
        try {
            const res = await fetch(src, { method: 'HEAD' });
            if (res.ok) return src;
        } catch {}
        return null;
    }

    // Sem extensão → tenta todas
    for (const ext of extensoes) {
        const src = 'imagens/' + codigo + ext;
        try {
            const res = await fetch(src, { method: 'HEAD' });
            if (res.ok) return src;
        } catch {}
    }
    return null;
}

async function buscar() {
    const termo = document.getElementById('busca').value.trim();
    const familia = document.getElementById('filtroFamilia').value;
    const resDiv = document.getElementById('resultado');

    let filtro = dados.filter(d => {
        const matchCod = !termo || d.codigo.includes(termo);
        const matchFam = !familia || d.familia === familia;
        return matchCod && matchFam;
    });

    if (!termo && !familia) {
        resDiv.innerHTML = '<p class="nenhum">Digite um código ou selecione uma família para buscar</p>';
        return;
    }

    if (filtro.length === 0) {
        resDiv.innerHTML = '<p class="nenhum">Nenhum material encontrado com estes filtros</p>';
        return;
    }

    // Exibe o primeiro resultado mais relevante
    const item = filtro[0];
    let html = `
        <div class="cartao">
            <div class="area-imagem" id="areaImg">
                <span>🔍 Buscando imagem...</span>
            </div>
            <div class="conteudo">
                <div class="codigo">${item.codigo}</div>
                <div class="descricao">${item.descricao}</div>
                <span class="etiqueta">${item.familia}</span>
                <div class="unidade">Unidade: ${item.unidade}</div>
            </div>
        </div>
    `;
    resDiv.innerHTML = html;

    // Carrega a imagem
    const srcImg = await testarImagem(item.codigo, item.foto);
    const areaImg = document.getElementById('areaImg');
    if (srcImg) {
        areaImg.innerHTML = `<img src="${srcImg}" alt="Imagem ${item.codigo}" onerror="this.parentElement.innerHTML='<span class=\\'aviso\\'>📸 Arquivo não encontrado</span>'">`;
    } else {
        areaImg.innerHTML = `<span class="aviso">📸 Foto não disponível — verifique se ${item.codigo}.jpg está na pasta /imagens/</span>`;
    }
}

carregarCSV();
</script>
</body>
</html>
